<div class="atelie-studio">
    <header class="atelie-studio__header">
        <div class="atelie-studio__title-wrap">
            <h1 class="atelie-studio__title" data-bind="text: productName"></h1>
            <p class="atelie-studio__subtitle">
                a partir de <span data-bind="text: formattedBasePrice"></span>
                <!-- ko if: prazoProducao() > 0 -->
                · pronto em <span data-bind="text: prazoProducao"></span> dias úteis
                <!-- /ko -->
            </p>
        </div>
        <div class="atelie-studio__price" aria-live="polite" aria-atomic="true">
            <span class="atelie-studio__price-value" data-bind="text: formattedMirrorPrice"></span>
            <!-- ko if: extraPriceText() -->
            <span class="atelie-studio__price-extra" data-bind="text: extraPriceText"></span>
            <!-- /ko -->
        </div>
    </header>

    <nav class="atelie-studio__tabs" role="tablist" aria-label="Grupos">
        <!-- ko foreach: { data: grupos, as: 'grupo' } -->
        <button type="button" class="atelie-studio__tab" role="tab"
                data-bind="text: grupo.nome,
                    attr: {
                        'aria-selected': $parent.activeTab() === grupo.codigo ? 'true' : 'false',
                        'aria-controls': 'atelie-panel-' + grupo.codigo,
                        'tabindex': $parent.activeTab() === grupo.codigo ? 0 : -1
                    },
                    css: { 'is-active': $parent.activeTab() === grupo.codigo },
                    click: function () { $parent.switchTab(grupo.codigo); },
                    event: {
                        keydown: function (data, event) {
                            return $parent.handleTabKeydown(event, grupo.codigo);
                        }
                    }"></button>
        <!-- /ko -->
    </nav>

    <section class="atelie-studio__panel" role="tabpanel"
             data-bind="attr: { id: 'atelie-panel-' + activeTab(), 'aria-label': currentGroup().nome }">
        <header class="atelie-studio__group-header">
            <h3 class="atelie-studio__group-title">
                <span class="atelie-studio__group-name" data-bind="text: currentGroup().nome"></span>
                <span class="atelie-studio__group-sep"> · </span>
                <span class="atelie-studio__group-desc" data-bind="text: getGroupDescription(currentGroup())"></span>
            </h3>
        </header>

        <div class="atelie-studio__options" role="radiogroup"
             data-bind="attr: { 'aria-label': 'Escolha ' + currentGroup().nome }">
            <!-- ko foreach: { data: currentOptions, as: 'option' } -->
            <div class="atelie-swatch-wrapper">
                <button type="button" class="atelie-swatch" role="radio"
                        data-bind="
                            attr: {
                                'aria-checked': ($parent.isSelected($parent.activeTab(), option.codigo) && !$parent.isBlocked(option.codigo)) ? 'true' : 'false',
                                'aria-disabled': $parent.isBlocked(option.codigo) ? 'true' : 'false',
                                'aria-describedby': $parent.isBlocked(option.codigo) ? 'atelie-tooltip-' + $parent.activeTab() + '-' + option.codigo : null,
                                title: $parent.isBlocked(option.codigo) ? $parent.getBlockReason(option.codigo) : ($parent.getOptionHint(option.codigo) || option.nome),
                                'aria-label': option.nome
                                    + ($parent.getOptionPrice(option) > 0 ? ', mais ' + $parent.getOptionPrice(option).toFixed(2).replace('.', ',') + ' reais' : ', incluso')
                                    + (($parent.isSelected($parent.activeTab(), option.codigo) && !$parent.isBlocked(option.codigo)) ? ', selecionado' : '')
                                    + ($parent.isBlocked(option.codigo) ? ', bloqueado: ' + $parent.getBlockReason(option.codigo) : '')
                            },
                            css: {
                                'is-selected': $parent.isSelected($parent.activeTab(), option.codigo) && !$parent.isBlocked(option.codigo),
                                'is-blocked': $parent.isBlocked(option.codigo),
                                'is-esgotado': $parent.isEsgotado(option.codigo)
                            },
                            click: function () { $parent.selectOption($parent.activeTab(), option); }">
                    <span class="atelie-swatch__circle-wrap">
                        <span class="atelie-swatch__color"
                              data-bind="style: { backgroundColor: $parent.getOptionColor(option) }"></span>
                        <span class="atelie-swatch__check" aria-hidden="true">✓</span>
                    </span>
                    <span class="atelie-swatch__info">
                        <span class="atelie-swatch__name" data-bind="text: option.nome"></span>
                        <span class="atelie-swatch__price"
                              data-bind="text: $parent.getOptionPrice(option) > 0 ? '+ ' + $parent.formatPrice($parent.getOptionPrice(option)) : 'incluso'"></span>
                    </span>
                </button>
                <!-- ko if: $parent.isBlocked(option.codigo) && $parent.activeTooltip() === option.codigo -->
                <div class="atelie-swatch__tooltip" role="alert"
                     data-bind="attr: { id: 'atelie-tooltip-' + $parent.activeTab() + '-' + option.codigo }">
                    <!-- ko if: $parent.isExigeRule(option.codigo) -->
                    <span class="atelie-swatch__tooltip-badge">Dica</span>
                    <!-- /ko -->
                    <p class="atelie-swatch__tooltip-text" data-bind="text: $parent.getBlockReason(option.codigo)"></p>
                </div>
                <!-- /ko -->
            </div>
            <!-- /ko -->
        </div>
    </section>

    <div class="atelie-studio__row">
        <section class="atelie-studio__size">
            <label class="atelie-studio__section-label" for="atelie-size-select">Tamanho</label>
            <div class="atelie-select-wrapper">
                <select id="atelie-size-select" class="atelie-size-select"
                        data-bind="options: gradeTamanhos, value: selectedSize, event: { change: function (d, e) { selectSize(e.target.value); } }"></select>
            </div>
        </section>

        <!-- ko if: permiteGravacao -->
        <section class="atelie-studio__laser" data-bind="css: { 'is-disabled': engravingBlocked }">
            <label class="atelie-studio__section-label" for="atelie-laser-input">Gravação na entressola</label>
            <div class="atelie-laser-wrapper">
                <input type="text" id="atelie-laser-input" class="atelie-studio__laser-input" autocomplete="off"
                       data-bind="textInput: laserText,
                            disable: engravingBlocked,
                            attr: {
                                maxlength: laserLimit,
                                placeholder: engravingBlocked() ? engravingBlockedReason() : laserPlaceholder,
                                'aria-describedby': 'atelie-laser-hint'
                            }">
                <!-- ko ifnot: engravingBlocked -->
                <span class="atelie-laser-counter" data-bind="text: laserCounterText"></span>
                <!-- /ko -->
            </div>
            <p class="atelie-studio__laser-hint" id="atelie-laser-hint">
                <!-- ko ifnot: engravingBlocked -->
                <span data-bind="text: laserPrice() > 0 ? '+ ' + formatPrice(laserPrice()) : 'incluso'"></span>
                · letras, números e espaço
                <!-- /ko -->
                <!-- ko if: engravingBlocked -->
                <strong class="atelie-laser-blocked-reason" data-bind="text: engravingBlockedReason"></strong>
                <!-- /ko -->
            </p>
        </section>
        <!-- /ko -->
    </div>

    <div class="atelie-studio__actions">
        <button type="submit"
                form="product_addtocart_form"
                class="atelie-studio__submit"
                data-bind="
                    disable: isSubmitting,
                    css: { 'is-loading': isSubmitting }">
            <!-- ko ifnot: isSubmitting -->
            <span>Adicionar ao carrinho</span>
            <span class="atelie-studio__submit-sep" aria-hidden="true">·</span>
            <span data-bind="text: formattedMirrorPrice"></span>
            <!-- /ko -->
            <!-- ko if: isSubmitting -->
            <span>Adicionando ao carrinho...</span>
            <!-- /ko -->
        </button>

        <!-- ko if: actionError -->
        <div class="atelie-studio__error-message"
             role="alert"
             aria-live="assertive"
             data-bind="text: actionError"></div>
        <!-- /ko -->
    </div>

    <div class="atelie-studio__hidden" aria-hidden="true">
        <!-- ko foreach: { data: grupos, as: 'grupo' } -->
        <input type="hidden" form="product_addtocart_form"
               data-bind="attr: {
                   name: 'atelie[selecoes][' + $index() + '][grupo]',
                   value: grupo.codigo }">
        <input type="hidden" form="product_addtocart_form"
               data-bind="attr: {
                   name: 'atelie[selecoes][' + $index() + '][componente]',
                   value: $parent.selections[grupo.codigo] ? $parent.selections[grupo.codigo]() : '' }">
        <!-- /ko -->
        <input type="hidden" form="product_addtocart_form" name="atelie[tamanho]"
               data-bind="attr: { value: selectedSize() }">
        <input type="hidden" form="product_addtocart_form" name="atelie[gravacao]"
               data-bind="attr: { value: (permiteGravacao() && !engravingBlocked()) ? laserText() : '' }">
    </div>
</div>
