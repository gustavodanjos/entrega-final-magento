name: Quality

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

jobs:
  quality:
    name: PHPCS + PHPUnit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, soap, bcmath, gd, xsl, zip
          tools: composer:v2
          coverage: none

      - name: Configure Magento repo auth
        run: composer config --global http-basic.repo.magento.com "${{ secrets.MAGENTO_PUBLIC_KEY }}" "${{ secrets.MAGENTO_PRIVATE_KEY }}"

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ hashFiles('src/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPCS (Magento2)
        run: vendor/bin/phpcs app/code/Nuvem

      - name: PHPUnit (Nuvem)
        run: |
          vendor/bin/phpunit \
            -c dev/tests/unit/phpunit.xml.dist \
            app/code/Nuvem